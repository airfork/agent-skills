name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The matrix outlived its original reason. It existed for the adversarial-review
  # control plane's two filesystem backends, which v2 deleted along with the
  # control plane itself. It is kept because the remaining suite still shells out
  # and still manipulates paths, and those are where platform differences bite.
  #
  # Tests that create symlinks are the most likely Windows failures, since
  # unprivileged symlink creation there depends on Developer Mode. fail-fast is
  # off so one platform's failures never mask another's.
  tests:
    name: ${{ matrix.os }} ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false

      # Minitest 6 extracted Mock into its own gem; Minitest 5 still bundles it.
      # Best effort so the job works on either.
      - name: Install minitest-mock
        shell: bash
        run: gem install minitest-mock --no-document || echo "using bundled Minitest::Mock"

      - name: Tests
        shell: bash
        run: scripts/test

  # The repository contract gate: syntax, manifest, schema, and doc contracts.
  # POSIX-only because it shells out to bash tooling by design.
  verify:
    name: verify (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      # Minitest 6 extracted Mock into its own gem; Minitest 5 still bundles it.
      # Best effort so the job works on either.
      - name: Install minitest-mock
        shell: bash
        run: gem install minitest-mock --no-document || echo "using bundled Minitest::Mock"

      - name: Verify
        run: scripts/verify
