  pricing_authority: {type: array, minItems: 1, items: {type: object, required: [provider, model, currency, effective_from, effective_to, input, output, cache, reasoning, minimum_charge, failed_request_charge, token_cap, source_digest, provider_cap_evidence], additionalProperties: false, properties: {provider: {type: string, minLength: 1}, model: {type: string, minLength: 1}, currency: {type: string, const: USD}, effective_from: {type: string, minLength: 1}, effective_to: {type: string, minLength: 1}, input: {type: number, minimum: 0}, output: {type: number, minimum: 0}, cache: {type: number, minimum: 0}, reasoning: {type: number, minimum: 0}, minimum_charge: {type: number, minimum: 0}, failed_request_charge: {type: number, minimum: 0}, token_cap: {type: integer, minimum: 1}, source_digest: {type: string, pattern: '\A[0-9a-f]{64}\z'}, provider_cap_evidence: {type: object, required: [enforced, digest], additionalProperties: false, properties: {enforced: {type: boolean, const: true}, digest: {type: string, pattern: '\A[0-9a-f]{64}\z'}}}}}}
  provider_caps: {type: object, required: [codex, claude], additionalProperties: false, properties: {codex: {type: number, minimum: 0}, claude: {type: number, minimum: 0}}}
