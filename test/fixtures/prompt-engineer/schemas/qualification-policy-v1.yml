  operator_choices: {type: object, required: [codex, claude], additionalProperties: false, properties: {codex: {type: object, required: [model, effort, timeout_seconds], additionalProperties: false, properties: {model: {type: string, minLength: 1}, effort: {type: string, enum: [low, medium, high]}, timeout_seconds: {type: integer, minimum: 1}}}, claude: {type: object, required: [model, effort, timeout_seconds], additionalProperties: false, properties: {model: {type: string, minLength: 1}, effort: {type: string, enum: [low, medium, high]}, timeout_seconds: {type: integer, minimum: 1}}}}}
  money_limit_usd: {type: number, minimum: 0.01}
  hosts: {type: array, items: {type: string, enum: [codex, claude]}}
  model_effort: {type: object, required: [codex, claude], additionalProperties: false, properties: {codex: {type: object, required: [model, effort], additionalProperties: false, properties: {model: {type: string, minLength: 1}, effort: {type: string, enum: [low, medium, high]}}}, claude: {type: object, required: [model, effort], additionalProperties: false, properties: {model: {type: string, minLength: 1}, effort: {type: string, enum: [low, medium, high]}}}}}
  allowlists: {type: object, required: [tools, runtime_read, writable, environment], additionalProperties: false, properties: {tools: {type: array, items: {type: string}}, runtime_read: {type: array, items: {type: string}}, writable: {type: array, items: {type: string}}, environment: {type: array, items: {type: string}}}}
  endpoint_policy: {type: object, required: [provider_only, endpoints], additionalProperties: false, properties: {provider_only: {type: boolean, const: true}, endpoints: {type: array, items: {type: string}}}}
  timeout_seconds: {type: integer, minimum: 1}
