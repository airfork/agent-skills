properties:
  schema_version: {type: integer, const: 1}
  capability_evidence_digests: {type: object, required: [codex, claude], additionalProperties: false, properties: {codex: {type: string, pattern: '\A[0-9a-f]{64}\z'}, claude: {type: string, pattern: '\A[0-9a-f]{64}\z'}}}
