type: object
required: [schema_version, run_id, host, case_id, arm, repeat_index, public_task_packet_digest, arm_environment_manifest_digest, expected_package_digest, masked_label_map_digest, sandbox_launch_attestation_digest, session, fresh_session_evidence, timestamps, cli, model, effort, configuration_digest, environment_digest, tool_inventory, messages, tool_events, final_status, exit_status, raw_export_digest, usage]
additionalProperties: false
properties:
  schema_version: {type: integer, const: 1}
  run_id: {type: string, minLength: 1}
  host: {type: string, enum: [codex, claude]}
  case_id: {type: string, pattern: '\APE-[0-9]{3}\z'}
  arm: {type: string, enum: [unassisted, legacy, replacement]}
  repeat_index: {type: integer, minimum: 0}
  public_task_packet_digest: {type: string, pattern: '\A[0-9a-f]{64}\z'}
  arm_environment_manifest_digest: {type: string, pattern: '\A[0-9a-f]{64}\z'}
  expected_package_digest: {type: string, pattern: '\A[0-9a-f]{64}\z'}
  masked_label_map_digest: {type: string, pattern: '\A[0-9a-f]{64}\z'}
  sandbox_launch_attestation_digest: {type: string, pattern: '\A[0-9a-f]{64}\z'}
  session: {type: object, required: [id, fresh], additionalProperties: false, properties: {id: {type: string, minLength: 1}, fresh: {type: boolean, const: true}}}
  fresh_session_evidence: {type: object, required: [new_session_marker, parent_session_absent, first_event_ordinal], additionalProperties: false, properties: {new_session_marker: {type: string, minLength: 1}, parent_session_absent: {type: boolean, const: true}, first_event_ordinal: {type: integer, minimum: 0}}}
  timestamps: {type: object, required: [started_at, ended_at], additionalProperties: false, properties: {started_at: {type: string, minLength: 1}, ended_at: {type: string, minLength: 1}}}
  cli: {type: object, required: [name, version, executable_digest], additionalProperties: false, properties: {name: {type: string, minLength: 1}, version: {type: string, minLength: 1}, executable_digest: {type: string, pattern: '\A[0-9a-f]{64}\z'}}}
  model: {type: string, minLength: 1}
  effort: {type: string, minLength: 1}
  configuration_digest: {type: string, pattern: '\A[0-9a-f]{64}\z'}
  environment_digest: {type: string, pattern: '\A[0-9a-f]{64}\z'}
  tool_inventory: {type: array, items: {type: string, minLength: 1}}
  messages: {type: array, minItems: 1, items: {type: object, required: [ordinal, channel, text], additionalProperties: false, properties: {ordinal: {type: integer, minimum: 0}, channel: {type: string, enum: [assistant, user, system]}, text: {type: string}}}}
  tool_events: {type: array, items: {type: object, required: [ordinal, tool, status], additionalProperties: false, properties: {ordinal: {type: integer, minimum: 0}, tool: {type: string, minLength: 1}, status: {type: string, enum: [started, completed, failed]}}}}
  final_status: {type: string, enum: [completed, failed, aborted, inconclusive]}
  exit_status: {type: integer, minimum: 0}
  raw_export_digest: {type: string, pattern: '\A[0-9a-f]{64}\z'}
  usage: {type: object, required: [input_tokens, output_tokens], additionalProperties: false, properties: {input_tokens: {type: integer, minimum: 0}, output_tokens: {type: integer, minimum: 0}, total_tokens: {type: integer, minimum: 0}}}
