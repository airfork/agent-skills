type: object
required: [schema_version, run_id, host, case_id, arm, session, messages, usage]
additionalProperties: false
properties:
  schema_version: {type: integer, const: 1}
  run_id: {type: string, minLength: 1}
  host: {type: string, enum: [codex, claude]}
  case_id: {type: string, pattern: '\APE-[0-9]{3}\z'}
  arm: {type: string, enum: [unassisted, legacy, replacement]}
  session: {type: object, required: [id, fresh], additionalProperties: false, properties: {id: {type: string, minLength: 1}, fresh: {type: boolean, const: true}}}
  messages: {type: array, minItems: 1, items: {type: object, required: [ordinal, channel, text], additionalProperties: false, properties: {ordinal: {type: integer, minimum: 0}, channel: {type: string, enum: [assistant, user, system]}, text: {type: string}}}}
  usage: {type: object, required: [input_tokens, output_tokens], additionalProperties: false, properties: {input_tokens: {type: integer, minimum: 0}, output_tokens: {type: integer, minimum: 0}}}
