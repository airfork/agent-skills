schema_version: 1

categories:
  general:
    path: skills/general
    description: Portable skills that can be used across agent environments.
  codex-cursor:
    path: skills/codex-cursor
    description: Skills designed for Codex and/or Cursor workflows.
  claude:
    path: skills/claude
    description: Claude-only skills and command workflows.
  claude-ultracode:
    path: skills/claude-ultracode
    description: Claude workflows that explicitly assume UltraCode.

model_tiers:
  fast:
    codex: GPT-5.6 Luna
    claude: Sonnet medium
    gemini: Gemini CLI default low-effort model
    use_for: Small edits, simple transforms, and quick checks.
  standard:
    codex: GPT-5.6 Terra
    claude: Sonnet high
    gemini: Gemini CLI default model
    use_for: Normal skill execution and repo-aware work.
  deep:
    codex: GPT-5.6 Sol
    claude: Opus 4.8 high
    gemini: Gemini CLI highest available reasoning model
    use_for: Broad reviews, ambiguous planning, architecture, and high-risk work.
  ultracode:
    codex: null
    claude: Opus 4.8 high with UltraCode
    gemini: null
    use_for: Claude-only workflows that explicitly benefit from UltraCode.

skills:
  - name: adversarial-review
    path: skills/general/adversarial-review
    category: general
    status: active
    interfaces:
      - claude
      - codex
      - cursor
      - gemini
    recommended_model_tier: deep
    heavy_model_tier: ultracode
    install:
      codex:
        enabled: true
        mode: symlink
      claude:
        enabled: true
        mode: symlink
      cursor:
        enabled: true
        mode: symlink
      gemini:
        enabled: true
        mode: symlink
    description: Script-backed portable control plane for deterministic adversarial review of specs and plans, with verified direct adapters or first-class generic task bundles, immutable IDs, revise/reject resolution, and resumable provenance-rich reports.
    notes: Place in general because one portable task/result contract supports Codex, Claude Code, Cursor, Gemini, and other generic hosts. Managed symlink install is available for Codex, Claude, Cursor, and Gemini, but review execution never applies global install changes. Direct adapters run only after machine-readable capability attestation; unsupported or unverified CLIs use generic bundles. Codex named-agent TOMLs remain optional separate setup.

  - name: code-review
    path: skills/codex-cursor/code-review
    category: codex-cursor
    status: active
    interfaces:
      - codex
      - cursor
      - gemini
    recommended_model_tier: deep
    heavy_model_tier: deep
    install:
      codex:
        enabled: true
        mode: symlink
      cursor:
        enabled: false
        mode: symlink
      gemini:
        enabled: true
        mode: symlink
    description: Codex-first multi-angle review workflow mirroring the built-in Claude Code /code-review (method-based finder angles, verdict-ladder verification, gap sweep at deep), plus verified-finding remediation, opt-in fix/commit/push/PR flags, and Cursor adapter notes.
    notes: Finalized under the codex-cursor category and installed into Codex and Gemini through managed symlinks. The portable workflow can run on Gemini/Antigravity through activate_skill plus sequential or available-subagent fallback; do not create a Gemini-specific copy. Tier structure ports the built-in Claude Code effort cells (quick=low inline pass, standard/high=8 angles + 1-vote verify, deep=10 angles + sweep). Flags support --fix, --commit, --push, --pr, and --comment with verification-gated git/GitHub actions.

  - name: milestone-orchestrator
    path: skills/general/milestone-orchestrator
    category: general
    status: active
    interfaces:
      - claude
      - codex
    recommended_model_tier: deep
    heavy_model_tier: ultracode
    install:
      codex:
        enabled: true
        mode: symlink
      claude:
        enabled: true
        mode: symlink
      cursor:
        enabled: false
        mode: symlink
      gemini:
        enabled: false
        mode: symlink
    description: Two-phase milestone workflow with an interactive PREPARE phase (repository grounding, consolidated decision packets, adversarially reviewed SPEC/PLAN, one final approval) and an unattended multi-agent RUN phase covering implementation, review remediation, serial integration, verification, automatic commit/push/draft-PR, mandatory final code review, and lifecycle resource cleanup, always stopping before merge or deploy.
    notes: Orca orchestration is the reference adapter; native Codex and native Claude Code adapters preserve the same policy via probed host primitives. Design at docs/plans/2026-07-13-milestone-orchestrator-design.md; v1 ships the workflow, templates, and the validate-state validator, while the design's enforcement scripts and pressure/fixture validation layers are recorded as deferred in references/validation.md. Gemini disabled until an adapter is defined.

  - name: ui-drill
    path: skills/claude/ui-drill
    category: claude
    status: active
    interfaces:
      - claude
    recommended_model_tier: standard
    heavy_model_tier: standard
    install:
      codex:
        enabled: false
        mode: symlink
      claude:
        enabled: true
        mode: symlink
      cursor:
        enabled: false
        mode: symlink
      gemini:
        enabled: false
        mode: symlink
    description: Personal UI/UX critique tutoring course that generates deliberately flawed mockups, grades perception and articulation separately, and adapts a nine-module curriculum via a persistent student model.
    notes: Claude-only; relies on Claude Code side-panel HTML rendering (SendUserFile) and conversational tutoring. Mutable learner state lives in the skill's git-ignored state/ subfolder (first use of the skills/**/state/ convention) with a session-end mirror to ~/.local/state/ui-drill/. Design doc at docs/plans/2026-07-06-ui-drill-design.md; ultra adversarial review passed (see the -review.md companion).
